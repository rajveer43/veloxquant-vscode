name: Release

# Fires on any tag matching v0.1.0, v1.2.3, etc. Push a tag to publish:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write # needed to attach the .vsix to a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build bundle
        run: npm run build

      - name: Package
        run: npx vsce package --no-dependencies -o release.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath release.vsix -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish release.vsix -p ${{ secrets.OVSX_PAT }}

      - name: Attach .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.vsix
          generate_release_notes: true

# --------------------------------------------------------------------------
# One-time setup this workflow depends on (do this before pushing a tag):
#
# 1. Repo secrets (Settings -> Secrets and variables -> Actions -> New
#    repository secret):
#      VSCE_PAT  — Azure DevOps PAT, Marketplace scope = Manage,
#                  organization = "All accessible organizations"
#      OVSX_PAT  — Open VSX access token from open-vsx.org (Profile ->
#                  Access Tokens), only needed if publishing there too;
#                  delete the "Publish to Open VSX" step if not.
#
# 2. package.json "version" must be bumped and committed BEFORE tagging —
#    this workflow refuses to publish if the tag and package.json disagree,
#    so `npm version patch` (or minor/major) is the safest way to do both
#    the bump and the tag together:
#
#      npm version patch        # bumps package.json + creates a git tag
#      git push origin master --follow-tags
#
#    That last push is what actually triggers this workflow.
# --------------------------------------------------------------------------

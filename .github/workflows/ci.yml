name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Build bundle
        run: npm run build

      - name: Package (dry run)
        run: npx vsce package --no-dependencies -o veloxquant-vscode-dryrun.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-dry-run
          path: veloxquant-vscode-dryrun.vsix

# --------------------------------------------------------------------------
# NOTE: publishing is intentionally NOT configured here.
#
# A future tag-triggered release workflow would look roughly like:
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     publish:
#       runs-on: macos-latest
#       steps:
#         - uses: actions/checkout@v4
#         - uses: actions/setup-node@v4
#           with: { node-version: '20' }
#         - run: npm ci && npm run build
#         - run: npx vsce publish -p ${{ secrets.VSCE_PAT }}
#         - run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
#
# This requires VSCE_PAT (Azure DevOps PAT for the Marketplace publisher)
# and OVSX_PAT (Open VSX access token) as real repository secrets, and a
# registered publisher account. None of that is configured in this repo —
# do not add it without an explicit decision to actually publish.
# --------------------------------------------------------------------------

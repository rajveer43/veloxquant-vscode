name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Build bundle
        run: npm run build

      - name: Package (dry run)
        run: npx vsce package --no-dependencies -o veloxquant-vscode-dryrun.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-dry-run
          path: veloxquant-vscode-dryrun.vsix

# Publishing is handled by the separate tag-triggered workflow in
# release.yml, not here. This workflow only builds/tests/dry-run-packages
# on every push and PR against master.

<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VeloxQuant-MLX for VS Code</title>
  <desc id="desc">Install the VeloxQuant-MLX VS Code extension to recommend KV-cache compression methods and run the Compression Lab for mlx_lm models on Apple Silicon.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171722"/>
      <stop offset="1" stop-color="#121219"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ecfc0"/>
      <stop offset="1" stop-color="#59e2d3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ecfc0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3ecfc0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .tabular { font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="120" r="260" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#2a2a3c" stroke-width="1"/>

  <!-- ============ LEFT COLUMN ============ -->
  <g transform="translate(64,64)">
    <!-- wordmark -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#3ecfc0" transform="rotate(45 17 17)"/>
      <text x="52" y="25" class="mono" font-size="25" font-weight="700" fill="#eceef5" letter-spacing="-0.3">VeloxQuant-MLX</text>
    </g>

    <text x="0" y="70" class="sans" font-size="17" fill="#8d8fa3">KV-cache compression for <tspan fill="#c7c8d6">mlx_lm</tspan>, without leaving VS Code</text>

    <!-- divider -->
    <line x1="0" y1="104" x2="420" y2="104" stroke="#33334a" stroke-width="1"/>

    <!-- install steps: real sequence -->
    <text x="0" y="140" class="mono" font-size="12" fill="#6f7188" letter-spacing="2">INSTALL</text>

    <g transform="translate(0,162)" class="sans">
      <!-- step 1 -->
      <circle cx="11" cy="8" r="11" fill="none" stroke="#3ecfc0" stroke-width="1.5"/>
      <text x="11" y="12" text-anchor="middle" class="mono tabular" font-size="11" fill="#3ecfc0">1</text>
      <text x="34" y="13" font-size="16" fill="#dcdde8">Open Extensions</text>
      <text x="238" y="13" font-size="14" class="mono" fill="#6f7188">⇧⌘X</text>

      <!-- connector -->
      <line x1="11" y1="19" x2="11" y2="47" stroke="#33334a" stroke-width="1.5"/>

      <!-- step 2 -->
      <g transform="translate(0,40)">
        <circle cx="11" cy="8" r="11" fill="none" stroke="#3ecfc0" stroke-width="1.5"/>
        <text x="11" y="12" text-anchor="middle" class="mono tabular" font-size="11" fill="#3ecfc0">2</text>
        <text x="34" y="13" font-size="16" fill="#dcdde8">Search “VeloxQuant-MLX”</text>
      </g>
      <line x1="11" y1="59" x2="11" y2="87" stroke="#33334a" stroke-width="1.5"/>

      <!-- step 3 -->
      <g transform="translate(0,80)">
        <circle cx="11" cy="8" r="11" fill="#3ecfc0"/>
        <text x="11" y="12" text-anchor="middle" class="mono tabular" font-size="11" fill="#12121c" font-weight="700">3</text>
        <text x="34" y="13" font-size="16" fill="#f4f5fa" font-weight="600">Install</text>
      </g>
    </g>

    <!-- CTA chip -->
    <g transform="translate(0,300)" filter="url(#soft)">
      <rect x="0" y="0" width="286" height="52" rx="8" fill="#3ecfc0"/>
      <text x="20" y="33" class="sans" font-size="16" font-weight="700" fill="#0d1414">Get it on VS Code Marketplace</text>
    </g>

    <text x="0" y="380" class="mono" font-size="12.5" fill="#565870">marketplace.visualstudio.com &#8594; veloxquant-mlx</text>

    <!-- chip badges footer -->
    <g transform="translate(0,432)">
      <text x="0" y="0" class="mono" font-size="12" fill="#6f7188" letter-spacing="2">APPLE SILICON</text>
      <g transform="translate(0,16)" class="mono tabular" font-size="13">
        <g transform="translate(0,0)">
          <rect width="46" height="26" rx="5" fill="#1c1c2a" stroke="#33334a"/>
          <text x="23" y="17" text-anchor="middle" fill="#a9abbd">M1</text>
        </g>
        <g transform="translate(54,0)">
          <rect width="46" height="26" rx="5" fill="#1c1c2a" stroke="#33334a"/>
          <text x="23" y="17" text-anchor="middle" fill="#a9abbd">M2</text>
        </g>
        <g transform="translate(108,0)">
          <rect width="46" height="26" rx="5" fill="#1c1c2a" stroke="#33334a"/>
          <text x="23" y="17" text-anchor="middle" fill="#a9abbd">M3</text>
        </g>
        <g transform="translate(162,0)">
          <rect width="46" height="26" rx="5" fill="#24243d" stroke="#3ecfc0"/>
          <text x="23" y="17" text-anchor="middle" fill="#3ecfc0">M4</text>
        </g>
        <g transform="translate(216,0)">
          <rect width="46" height="26" rx="5" fill="#1c1c2a" stroke="#33334a"/>
          <text x="23" y="17" text-anchor="middle" fill="#a9abbd">M5</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============ RIGHT COLUMN ============ -->
  <g transform="translate(560,64)">
    <rect x="0" y="0" width="576" height="502" rx="14" fill="#1c1c2a" stroke="#2c2c40" stroke-width="1"/>

    <!-- panel chrome dots -->
    <circle cx="26" cy="26" r="5" fill="#3a3a52"/>
    <circle cx="44" cy="26" r="5" fill="#3a3a52"/>
    <circle cx="62" cy="26" r="5" fill="#3a3a52"/>
    <text x="576" y="31" text-anchor="end" transform="translate(-24,0)" class="mono" font-size="12" fill="#565870" letter-spacing="1.5">COMPRESSION LAB</text>

    <line x1="0" y1="52" x2="576" y2="52" stroke="#2c2c40" stroke-width="1"/>

    <!-- hero stat -->
    <g transform="translate(32,92)">
      <text x="0" y="0" class="mono" font-size="13" fill="#6f7188" letter-spacing="2">KV-CACHE REDUCTION, UP TO</text>
      <text x="0" y="76" class="mono tabular" font-size="88" font-weight="700" fill="#f2a154">16<tspan font-size="46" fill="#c98a52">x</tspan></text>
      <text x="0" y="106" class="sans" font-size="15" fill="#8d8fa3">across 42 compression methods behind one API</text>
    </g>

    <!-- before/after bars -->
    <g transform="translate(32,236)">
      <text x="0" y="0" class="mono" font-size="12" fill="#6f7188" letter-spacing="1.5">KV CACHE, 7B @ 8K CONTEXT (ESTIMATE)</text>

      <g transform="translate(0,22)">
        <text x="0" y="14" class="mono tabular" font-size="13" fill="#a9abbd">fp16</text>
        <rect x="0" y="24" width="512" height="22" rx="4" fill="#2a2a3c"/>
        <text x="512" y="14" text-anchor="end" class="mono tabular" font-size="13" fill="#a9abbd">4096 MB</text>
      </g>

      <g transform="translate(0,86)">
        <text x="0" y="14" class="mono tabular" font-size="13" fill="#3ecfc0">compressed</text>
        <rect x="0" y="24" width="512" height="22" rx="4" fill="#2a2a3c"/>
        <rect x="0" y="24" width="64" height="22" rx="4" fill="url(#barFill)"/>
        <text x="512" y="14" text-anchor="end" class="mono tabular" font-size="13" fill="#3ecfc0">256 MB</text>
      </g>
    </g>

    <line x1="32" y1="384" x2="544" y2="384" stroke="#2c2c40" stroke-width="1"/>

    <!-- feature chips: the two real sidebars this extension ships -->
    <g transform="translate(32,406)">
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="248" height="70" rx="10" fill="#20202e" stroke="#2c2c40"/>
        <text x="18" y="28" class="sans" font-size="15" font-weight="600" fill="#eceef5">Recommend</text>
        <text x="18" y="50" class="sans" font-size="12.5" fill="#8d8fa3">Chip + RAM → best method</text>
      </g>
      <g transform="translate(264,0)">
        <rect x="0" y="0" width="248" height="70" rx="10" fill="#20202e" stroke="#2c2c40"/>
        <text x="18" y="28" class="sans" font-size="15" font-weight="600" fill="#eceef5">Compression Lab</text>
        <text x="18" y="50" class="sans" font-size="12.5" fill="#8d8fa3">Run it, right in the editor</text>
      </g>
    </g>
  </g>
</svg>
